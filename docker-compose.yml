services:
  mongodb:
    image: mongo:7.0
    container_name: game-mongodb
    restart: always
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: GameDB
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: game-api
    restart: always
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDBSettings__ConnectionString=mongodb://mongodb:27017
      - MongoDBSettings__DatabaseName=GameDB
    depends_on:
      - mongodb

volumes:
  mongodb_data:
  mongodb_config:
